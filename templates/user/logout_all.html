{{template "base" .}}
{{define "title"}}Logout All Devices{{end}}

{{define "content"}}
<div class="container-fluid">


    <div class="row mb-3">
        <div class="col-sm-12 col-md-8 col-lg-4 offset-md-2 offset-lg-4">
            <div class="row">
                        <div class="col-12">
                            <p><a href="/accounts" class="clean-link">Back to account</a></p>
                        </div>
                    </div>

            <div class="card shadow">
                <div class="card-body">
                    <form action="/accounts/logout_all" method="post">
                        <input type="hidden" name="csrf_token" value="{{ .CSRFToken}}">
                        <div class="row mb-2">
                            <div class="col-12">
                                <h4>Logout All Devices</h4>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-12">
                                <div class="row">
                                    <div class="col-12">
                                        <small>Password</small>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-12">
                                        <input type="password" name="password" class="form-control">
                                    </div>
                                </div>
                                {{ if .Data.ErrorPassword }}
                                <div class="row">
                                    <div class="col-12">
                                        <small class="text-danger">{{ .Data.ErrorPassword }}</small>
                                    </div>
                                </div>
                                {{end }}
                            </div>
                        </div>






                        <div class="row mb-3">
                            <div class="col-12">
                                <p>You are about to logout from all devices, including this one.</p>
                            </div>
                        </div>


                        <div class="row">
                            <div class="col-12">
                                <div class="d-flex justify-content-end align-items-center">
                                    <button type="submit" class="btn btn-sm btn-warning">Submit</button>
                                </div>
                                
                            </div>
                        </div>

                    </form>
                </div>
            </div>


        </div>
    </div>



</div>
{{end}}
