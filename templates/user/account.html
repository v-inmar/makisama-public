{{template "base" .}}
{{define "title"}}Account{{end}}

{{define "content"}}

<div class="container-fluid">


    <div class="row mb-3">
        <div class="col-sm-12 col-md-6 col-lg-4 offset-md-3 offset-lg-4">



            <div class="card mb-1">
                <div class="card-body">
                    <h4 class="card-title">Account</h4>
            
            
                    <!-- Name -->
                    <div class="row mb-2">
                        <div class="col-12">
                            <div class="list-group shadow">
                                <a href="/accounts/edit_name" class="list-group-item list-group-item-action">
                                    <div class="row">
                                        <div class="col-9">
                                            <div class="row">
                                                <div class="col-12">
                                                    <small><strong><i class="fa-solid fa-address-card"></i> Edit your
                                                            name</strong></small>
                                                </div>
                                            </div>
                                            <div class="row">
                                                <div class="col-12">
                                                    <p class="mb-0">
                                                        <span>{{ .Data.Name }}</span>
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
            
                                        <div class="col-3 d-flex justify-content-end align-items-center">
                                            <span class="text-primary"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                                    class="bi bi-arrow-right" viewBox="0 0 16 16">
                                                    <path fill-rule="evenodd"
                                                        d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8" />
                                                </svg></span>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
            
            
                    <!-- Email address -->
                    <div class="row mb-2">
                        <div class="col-12">
                            <div class="list-group shadow">
                                <a href="/accounts/replace_email" class="list-group-item list-group-item-action">
                                    <div class="row">
                                        <div class="col-9">
                                            <div class="row">
                                                <div class="col-12">
                                                    <small><strong><i class="fa-solid fa-at"></i> Replace your email
                                                            address</strong></small>
                                                </div>
                                            </div>
                                            <div class="row">
                                                <div class="col-12">
                                                    <p class="mb-0">
                                                        <span>{{ .Data.Email }}</span>
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
            
                                        <div class="col-3 d-flex justify-content-end align-items-center">
                                            <span class="text-primary">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-right"
                                                    viewBox="0 0 16 16">
                                                    <path fill-rule="evenodd"
                                                        d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8" />
                                                </svg>
                                            </span>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
            
                    <!-- Password -->
                    <div class="row mb-2">
                        <div class="col-12">
                            <div class="list-group shadow">
                                <a href="/accounts/update_password" class="list-group-item list-group-item-action">
                                    <div class="row">
                                        <div class="col-9">
                                            <div class="row">
                                                <div class="col-12">
                                                    <small><strong><i class="fa-solid fa-fingerprint"></i> Update your
                                                            password</strong></small>
                                                </div>
                                            </div>
                                            <div class="row">
                                                <div class="col-12">
                                                    <p class="mb-0">
                                                        <span>********</span>
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
            
                                        <div class="col-3 d-flex justify-content-end align-items-center">
                                            <span class="text-primary">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-right"
                                                    viewBox="0 0 16 16">
                                                    <path fill-rule="evenodd"
                                                        d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8" />
                                                </svg>
                                            </span>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
            
            
            
                </div>
            </div>

            <div class="row">
                <div class="col-4 d-flex justify-content-center align-items-center">
                    <small><a href="/accounts/logout_all" class="clean-link text-danger">Logout All</a></small>
                </div>

                <div class="col-4 d-flex justify-content-center align-items-center">
                    <small><a href="/accounts/deactivate" class="clean-link text-danger">Deactivate</a></small>
                </div>
                
                
                <div class="col-4 d-flex justify-content-center align-items-center">
                    <small><a href="/accounts/delete" class="clean-link text-danger">Delete</a></small>
                </div>
            </div>


            

            



        </div>
    </div>

</div>

{{ end }}
