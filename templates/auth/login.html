{{template "base" .}}
{{define "title"}}Login{{end}}

{{define "content"}}

<div class="container-fluid">
    <div class="row mb-3">
        <div class="col-12 d-flex justify-content-center">
            <div class="card shadow mt-5 card-auth-login">
                <div class="card-body">
                    <form method="post" action="/auth/login">
                        
                        <div class="row mb-2">
                            <div class="col-12 d-flex justify-content-center">
                                <h3 class="elms-sans-auth-card-title">Login</h3>
                            </div>
                        </div>

                        <input type="hidden" name="csrf_token" value="{{ .CSRFToken}}">

                        <div class="row mb-3">
                            <div class="col-12">

                                <div class="row">
                                    <div class="col-12">
                                        <small>Email Address</small>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-12">
                                        <input type="email" name="email" class="form-control" {{ if .Data.Email }} value="{{ .Data.Email }}" {{ end }} maxlength="250" required>
                                    </div>
                                </div>
                                {{ if .Data.ErrorEmail }}
                                <div class="row">
                                    <div class="col-12">
                                        <small class="text-danger">{{ .Data.ErrorEmail }}</small>
                                    </div>
                                </div>
                                {{ end }}

                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-12">

                                <div class="row">
                                    <div class="col-12">
                                        <small>Password</small>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-12">
                                        <input type="password" class="form-control" name="password" required>
                                    </div>
                                </div>
                                {{ if .Data.ErrorPassword }}
                                <div class="row">
                                    <div class="col-12">
                                        <small class="text-danger">{{ .Data.ErrorPassword }}</small>
                                    </div>
                                </div>
                                {{ end }}

                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-12 d-flex justify-content-between">
                        
                                <div class="form-check">
                                    <input class="form-check-input" name="remember" type="checkbox" checked>
                                    <small>Remember me</small>
                                </div>
                                <small><a class="clean-link" href="/auth/forgot_password">Forgot password</a></small>
                            </div>
                        </div>


                        <div class="row mb-1">
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary w-100">Login</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>


        </div>
    </div>
    <div class="d-flex justify-content-center">
        <small>Need an account? Sign up <a class="clean-link" href="/auth/signup">here</a></small>
    </div>
</div>

{{end}}
